version: 1

# Jupyter Book 2 (mystmd) projectconfiguratie.
#
# TOC-groei: elke bouw-agent voegt ZIJN EIGEN lecture toe onder het juiste
# `- title:` deel hieronder, op de plek die overeenkomt met PLAN.md §3.
# De TOC bevat uitsluitend bestanden die echt bestaan — een `file:` naar een
# ontbrekend bestand laat de build falen. De volledige beoogde volgorde staat
# als commentaar per deel; haal het commentaarteken weg zodra het bestand er is.

project:
  id: history-asset-pricing
  title: Geschiedenis van asset pricing
  short_title: Asset pricing
  description: >-
    Een chronologische reis door de asset pricing van 1863 tot nu, met
    afleidingen op PhD-niveau en replicaties op gratis data.
  authors:
    - name: Maarten Nies
      email: maartennies@gmail.com
      roles:
        - Conceptualization
        - Writing
  keywords:
    - asset pricing
    - financiële economie
    - geschiedenis van de economie
    - Python
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - references.bib
  numbering:
    headings: true
    equation: true
    figure:
      enabled: true
      template: 'Figuur %s'
    table:
      enabled: true
      template: 'Tabel %s'
  math:
    # Projectbrede macro's — beschikbaar in elke lecture.
    '\E': '\mathbb{E}'
    '\Var': '\operatorname{Var}'
    '\Cov': '\operatorname{Cov}'
    '\Corr': '\operatorname{Corr}'
    '\SD': '\operatorname{SD}'
    '\plim': '\operatorname{plim}'
  toc:
    - file: lectures/index.md

