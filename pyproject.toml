[project]
name = "hap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "ipykernel>=7.3.0",
    "jupyter-book>=2",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "linearmodels>=7.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.jupytext]
formats = "ipynb,md:myst"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hap"]

[tool.uv]
package = true

[tool.ruff]
line-length = 95
extend-exclude = ["lectures", "_build"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "NPY", "PD"]
ignore = ["D203", "D213", "PD011"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
