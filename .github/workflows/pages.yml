name: Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run jupyter book build --execute --html
        env:
          BASE_URL: /history-asset-pricing
      # De MyST-app zet de link naar myst-theme.css bij het laden zelf terug
      # naar de domeinroot, waar op een submap niets staat. Daarom gaat de
      # eigen opmaak mee in de css van het thema, die wel goed wordt geladen.
      - run: for f in _build/html/build/_assets/app-*.css; do cat custom.css >> "$f"; done
      # MyST zet BASE_URL niet voor myst-theme.css, de favicon en de
      # "back to top"-links; zonder dit mist de site haar eigen thema.
      - run: >
          find _build/html -name '*.html' -exec sed -i -E
          's#(href|src)="/(myst-theme\.css|favicon\.ico)#\1="/history-asset-pricing/\2#g;
           s#href="/([^"/][^"]*\#top)"#href="/history-asset-pricing/\1"#g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - uses: actions/deploy-pages@v4
        id: deployment
