name: Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run jupyter book build --execute --html
        env:
          BASE_URL: /history-asset-pricing
      # Op een schone build schrijft MyST een lege myst-theme.css in plaats
      # van custom.css, waardoor de site haar eigen opmaak mist.
      - run: cp custom.css _build/html/myst-theme.css
      # MyST zet BASE_URL niet voor myst-theme.css, de favicon en de
      # "back to top"-links; zonder dit mist de site haar eigen thema.
      - run: >
          find _build/html -name '*.html' -exec sed -i -E
          's#(href|src)="/(myst-theme\.css|favicon\.ico)#\1="/history-asset-pricing/\2#g;
           s#href="/([^"/][^"]*\#top)"#href="/history-asset-pricing/\1"#g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - uses: actions/deploy-pages@v4
        id: deployment
